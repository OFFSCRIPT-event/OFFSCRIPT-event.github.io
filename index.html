<script>
(function () {
  var START = new Date('2026-10-23T22:00:00+02:00').getTime();
  var END = new Date('2026-10-24T06:00:00+02:00').getTime();
  var hero = document.getElementById('hero');
  var el = { d: document.getElementById('dd'), h: document.getElementById('hh'), m: document.getElementById('mm'), s: document.getElementById('ss') };
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function tick() {
    var now = Date.now();
    if (now >= END) { hero.className = 'hero over'; return; }
    if (now >= START) { hero.className = 'hero live'; setTimeout(tick, 30000); return; }
    var t = Math.floor((START - now) / 1000);
    el.d.textContent = pad(Math.floor(t / 86400));
    el.h.textContent = pad(Math.floor(t % 86400 / 3600));
    el.m.textContent = pad(Math.floor(t % 3600 / 60));
    el.s.textContent = pad(t % 60);
    setTimeout(tick, 1000 - (now % 1000));
  }
  tick();
})();
</script>
